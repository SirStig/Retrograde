org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

mod.id=retrograde
mod.name=Retrograde
mod.group=com.ironcoffee
mod.version=1.0.0
mod.version_prefix=
mod.version_suffix=-alpha
mod.authors=SirStig
mod.contributors=
mod.license=MIT
mod.description=Tracks player-touched vs untouched chunks, and lets you regen or retrogen them from a map screen.
mod.sources_url=https://github.com/SirStig/Retrograde
mod.homepage_url=https://github.com/SirStig/Retrograde
mod.issues_url=https://github.com/SirStig/Retrograde/issues
mod.discord_url=https://discord.gg/QWJxfb4zQZ

deps.minecraft=[VERSIONED]
deps.fabric-api=[VERSIONED]
deps.neoforge=[VERSIONED]
deps.forge=[VERSIONED]

# Publishing
publish.dryrun=false

publish.modrinth.id=
publish.curseforge.id=

publish.modrinth=false
publish.curseforge=false
publish.github=false
publish.discord=false

publish.release.fabric=stable
publish.release.neoforge=stable
publish.release.forge=stable

publish.github.prerelease=false
publish.discord.dev=false

publish.github.branch=multiloader-stonecutter
publish.github.target=SirStig/Retrograde

# maven.kikugie.dev (LWJGL/Netty natives for very-fresh MC versions) has been
# timing out intermittently on default Gradle HTTP timeouts — bump them.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
